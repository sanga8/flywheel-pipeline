name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true # Speeds up subsequent runs
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev --group viz

      - name: Quality Checks
        # Using run multi-line to group similar tasks
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check

      - name: Run tests
        run: uv run pytest